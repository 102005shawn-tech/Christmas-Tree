<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Sparkling Star Christmas Tree</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030408;
      font-family: 'Inter', sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    /* 玻璃擬態光暈效果 */
    .glass-panel {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    /* 發光按鈕 */
    .glow-btn {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .glow-btn:hover {
      box-shadow: 0 0 20px rgba(220, 235, 255, 0.45);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-1px);
    }
    .glow-btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body class="text-slate-100 relative">

  <!-- 主畫布 -->
  <canvas id="treeCanvas"></canvas>

  <!-- 上方標題展示 -->
  <header class="absolute top-6 left-0 w-full z-10 flex flex-col items-center pointer-events-none px-4 text-center">
    <h1 class="font-cinzel text-xl sm:text-2xl md:text-3xl tracking-[0.25em] text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.7)] uppercase font-semibold">
      Christmas Tree Animation
    </h1>
    <p class="text-xs sm:text-sm text-slate-400 mt-1.5 tracking-widest font-light flex items-center gap-1.5">
      <span class="inline-block w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
      星光逐層浮現 · 3D 可拖曳視角
    </p>
  </header>

  <!-- 浮動操控面板 -->
  <div id="controlPanel" class="glass-panel absolute bottom-6 left-1/2 -translate-x-1/2 z-20 rounded-2xl p-3 sm:p-4 w-[92%] max-w-md transition-all duration-300">
    <div class="flex items-center justify-between gap-2 sm:gap-3">
      <!-- 重新浮現動畫按鈕 -->
      <button id="btnReplay" class="glow-btn flex-1 py-2.5 px-3 rounded-xl bg-white/10 border border-white/20 text-xs sm:text-sm font-medium flex items-center justify-center gap-1.5 hover:bg-white/20 text-white shadow-lg">
        <svg class="w-4 h-4 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        重新浮現
      </button>

      <!-- 色彩風格切換 -->
      <button id="btnColorTheme" class="glow-btn flex-1 py-2.5 px-3 rounded-xl bg-white/10 border border-white/20 text-xs sm:text-sm font-medium flex items-center justify-center gap-1.5 hover:bg-white/20 text-slate-200">
        <span id="themeDot" class="w-2.5 h-2.5 rounded-full bg-cyan-200 shadow-[0_0_8px_#38bdf8]"></span>
        <span id="themeName">銀白星光</span>
      </button>

      <!-- 自動旋轉開關 -->
      <button id="btnRotateToggle" class="glow-btn py-2.5 px-3.5 rounded-xl bg-white/10 border border-white/20 text-xs sm:text-sm font-medium hover:bg-white/20 text-slate-200">
        <svg id="rotateIcon" class="w-4 h-4 text-emerald-300 animate-spin" style="animation-duration: 6s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"></path>
        </svg>
      </button>
    </div>

    <!-- 提示小字 -->
    <div class="mt-2 text-center text-[11px] text-slate-400 font-light">
      滑鼠或手指在螢幕上滑動，可自由 360° 旋轉樹體
    </div>
  </div>

  <script>
    // --- 核心 Canvas 與 3D 渲染系統 ---
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    let width = 0;
    let height = 0;
    let dpr = window.devicePixelRatio || 1;

    // 視角與旋轉角度
    let angleY = 0;
    let angleX = 0.15;
    let targetAngleY = 0;
    let targetAngleX = 0.15;
    let autoRotate = true;
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    // 動畫時間控制 (從下到上逐層浮現)
    let animStartTime = performance.now();
    const RISING_DURATION = 5500; // 5.5 秒完成從底部至頂層一顆顆浮現並定型

    // 配色方案
    const COLOR_THEMES = [
      {
        name: "銀白晶芒",
        color: "#ffffff",
        starTint: "240, 248, 255",
        accent: "180, 220, 255",
        topColor: "#ffffff"
      },
      {
        name: "暖金星願",
        color: "#fbbf24",
        starTint: "255, 245, 210",
        accent: "251, 191, 36",
        topColor: "#fef08a"
      },
      {
        name: "夢幻極光",
        color: "#34d399",
        starTint: "210, 255, 235",
        accent: "56, 189, 248",
        topColor: "#a7f3d0"
      }
    ];
    let currentThemeIdx = 0;

    // 星星資料結構
    const TOTAL_STARS = 460;
    let stars = [];
    let backgroundSnow = [];

    // 螢幕自適應重置
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    // 初始化背景微細雪花光斑
    function initSnow() {
      backgroundSnow = [];
      const snowCount = Math.floor((width * height) / 12000);
      for (let i = 0; i < snowCount; i++) {
        backgroundSnow.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.4 + 0.1,
          speedY: Math.random() * 0.4 + 0.15,
          speedX: (Math.random() - 0.5) * 0.2
        });
      }
    }

    // 初始化聖誕樹上的星星 (圓錐螺旋分佈)
    function generateTreeStars() {
      stars = [];
      const treeHeight = Math.min(height * 0.58, 480);
      const baseRadius = treeHeight * 0.46;
      
      for (let i = 0; i < TOTAL_STARS; i++) {
        // progressFromBottom: 0 是樹底，1 是樹尖
        const progressFromBottom = i / (TOTAL_STARS - 1);

        // 圓錐半徑 (底部最大，頂端收束為0)
        // 加上非線性層次變化使聖誕樹層次更自然
        const layerWave = Math.sin(progressFromBottom * Math.PI * 14) * 0.08;
        const radius = baseRadius * (1 - progressFromBottom * 0.96) * (1 + layerWave);

        // 多條金螺旋交織
        const turns = 18.5;
        const theta = progressFromBottom * Math.PI * 2 * turns + (i % 3) * ((Math.PI * 2) / 3);

        // 加入少許隨機漂移量，讓樹看起來是由滿天繁星自然匯聚而成
        const jitterR = (Math.random() - 0.5) * 18 * (1 - progressFromBottom * 0.6);
        const jitterY = (Math.random() - 0.5) * 12;

        const actualR = Math.max(0, radius + jitterR);
        const x = Math.cos(theta) * actualR;
        const z = Math.sin(theta) * actualR;
        // Y 軸：原點在聖誕樹中心，底部為正，頂部為負
        const y = (0.5 - progressFromBottom) * treeHeight + jitterY;

        // 浮現時間依據高度(從下到上)：底部最早浮現，頂部最後浮現
        // 加入隨機延遲使它一顆一顆逐一閃爍冒出
        const riseStartRatio = progressFromBottom * 0.72 + (Math.random() * 0.12);

        stars.push({
          targetX: x,
          targetY: y,
          targetZ: z,
          // 出現前從更深處或更散開的起點聚集而來
          startX: x * 1.8 + (Math.random() - 0.5) * 80,
          startY: y + 100 + Math.random() * 60, // 從下方冒起
          startZ: z * 1.8 + (Math.random() - 0.5) * 80,
          
          progressFromBottom: progressFromBottom,
          riseStartRatio: riseStartRatio,
          
          size: Math.random() * 2.2 + 2.0, // 星芒大小
          twinkleSpeed: Math.random() * 0.05 + 0.03,
          twinklePhase: Math.random() * Math.PI * 2,
          burstSparkle: Math.random() > 0.85 // 特定較亮的大星
        });
      }

      // 在最頂端加入一顆碩大的聖誕頂星 (Tree Topper)
      stars.push({
        targetX: 0,
        targetY: -treeHeight * 0.52 - 12,
        targetZ: 0,
        startX: 0,
        startY: -treeHeight * 0.52 + 50,
        startZ: 0,
        progressFromBottom: 1.0,
        riseStartRatio: 0.90,
        size: 7.5,
        twinkleSpeed: 0.04,
        twinklePhase: 0,
        isTopper: true
      });
    }

    // 繪製高光四芒星光輝圖形 (十字星閃爍)
    function drawStarFlare(cx, cy, radius, alpha, tintRgb, isTopper = false) {
      if (alpha <= 0.01) return;
      ctx.save();
      ctx.translate(cx, cy);

      // 中心柔光球
      const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * (isTopper ? 4.5 : 3.0));
      glowGrad.addColorStop(0, `rgba(${tintRgb}, ${alpha})`);
      glowGrad.addColorStop(0.3, `rgba(${tintRgb}, ${alpha * 0.4})`);
      glowGrad.addColorStop(1, `rgba(${tintRgb}, 0)`);
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(0, 0, radius * (isTopper ? 4.5 : 3.0), 0, Math.PI * 2);
      ctx.fill();

      // 繪製尖銳閃爍的四芒/八芒星角
      const spikes = isTopper ? 8 : 4;
      const longRay = radius * (isTopper ? 4.2 : 3.4);
      const shortRay = radius * (isTopper ? 1.6 : 0.6);

      ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, alpha * 1.3)})`;
      ctx.beginPath();
      for (let s = 0; s < spikes * 2; s++) {
        const isLong = s % 2 === 0;
        const currentRay = isLong ? longRay : shortRay;
        const rot = (Math.PI / spikes) * s;
        const px = Math.cos(rot) * currentRay;
        const py = Math.sin(rot) * currentRay;
        if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      // 頂星特別外圈光環
      if (isTopper) {
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.8, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    // 渲染循環
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const elapsed = now - animStartTime;
      const globalProgress = Math.min(1, elapsed / RISING_DURATION);

      // 旋轉阻尼平滑插值
      if (autoRotate && !isDragging) {
        targetAngleY += 0.007; // 慢速旋轉欣賞
      }
      angleY += (targetAngleY - angleY) * 0.1;
      angleX += (targetAngleX - angleX) * 0.1;

      // 清除並繪製深邃午夜漸層黑底
      const bgGrad = ctx.createRadialGradient(width / 2, height * 0.45, 10, width / 2, height * 0.45, Math.max(width, height) * 0.7);
      bgGrad.addColorStop(0, '#0a0f1d');
      bgGrad.addColorStop(0.6, '#04060a');
      bgGrad.addColorStop(1, '#000103');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // 1. 繪製背景幽微落雪
      ctx.fillStyle = '#ffffff';
      for (let snow of backgroundSnow) {
        snow.y += snow.speedY;
        snow.x += snow.speedX;
        if (snow.y > height) {
          snow.y = -5;
          snow.x = Math.random() * width;
        }
        ctx.globalAlpha = snow.alpha;
        ctx.beginPath();
        ctx.arc(snow.x, snow.y, snow.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // 2. 投影計算 3D 星星
      const fov = 460;
      const centerX = width / 2;
      const centerY = height * 0.53; // 聖誕樹略偏下方，比例優雅
      const theme = COLOR_THEMES[currentThemeIdx];

      // 存放經過 3D 變換後的點，依據 Z 軸深度排序以正確處理前後遮擋與發光疊加
      const projectedStars = [];

      for (let star of stars) {
        // 計算各個星星是否已經輪到浮現時間
        let starProgress = 0;
        if (globalProgress >= star.riseStartRatio) {
          // 動畫在自己的區間內進展 (0 -> 1)
          const localProgress = (globalProgress - star.riseStartRatio) / 0.22;
          starProgress = Math.min(1, Math.max(0, localProgress));
        }

        // 若尚未開始浮現，則不繪製
        if (starProgress <= 0) continue;

        // 平滑緩和動畫 (Cubic Ease Out)
        const ease = 1 - Math.pow(1 - starProgress, 3);

        // 當前位置：從 start 浮現並移動至 target
        const curX = star.startX + (star.targetX - star.startX) * ease;
        const curY = star.startY + (star.targetY - star.startY) * ease;
        const curZ = star.startZ + (star.targetZ - star.startZ) * ease;

        // 3D 空間旋轉矩陣運算 (繞 Y 軸與微繞 X 軸)
        // 1. 繞 Y 軸旋轉
        const cosY = Math.cos(angleY);
        const sinY = Math.sin(angleY);
        const rotX1 = curX * cosY - curZ * sinY;
        const rotZ1 = curZ * cosY + curX * sinY;

        // 2. 繞 X 軸傾角旋轉 (仰角視角)
        const cosX = Math.cos(angleX);
        const sinX = Math.sin(angleX);
        const rotY2 = curY * cosX - rotZ1 * sinX;
        const rotZ2 = rotZ1 * cosX + curY * sinX;

        // 透視投影
        const cameraDistance = 600;
        const zTotal = rotZ2 + cameraDistance;
        if (zTotal <= 20) continue;

        const scale = fov / zTotal;
        const screenX = centerX + rotX1 * scale;
        const screenY = centerY + rotY2 * scale;

        // 個別閃爍 (Twinkle) 動畫
        star.twinklePhase += star.twinkleSpeed;
        const twinkleFactor = Math.sin(star.twinklePhase) * 0.35 + 0.65; // 0.3 ~ 1.0

        // 剛剛浮現時的瞬間光爆效果 (Pop-in burst flare)
        const popInBoost = (starProgress < 0.9) ? Math.sin(starProgress * Math.PI) * 1.5 : 0;

        // 深度感透明度 (前亮後暗)
        const depthAlpha = Math.max(0.3, Math.min(1.0, (rotZ2 + 250) / 450));
        const finalAlpha = Math.min(1.0, ease * depthAlpha * twinkleFactor + popInBoost * 0.4);

        projectedStars.push({
          x: screenX,
          y: screenY,
          z: rotZ2,
          radius: (star.size * scale) * (1 + popInBoost * 0.5),
          alpha: finalAlpha,
          isTopper: !!star.isTopper,
          burstSparkle: !!star.burstSparkle
        });
      }

      // 依深度從遠到近繪製
      projectedStars.sort((a, b) => a.z - b.z);

      // 3. 繪製所有星星光芒
      for (let p of projectedStars) {
        const tint = p.isTopper ? '255, 255, 255' : theme.starTint;
        drawStarFlare(p.x, p.y, p.radius, p.alpha, tint, p.isTopper);
      }

      // 4. 樹底部的晶亮微弱倒影光暈
      const treeBottomY = centerY + 180;
      const baseGrad = ctx.createRadialGradient(centerX, treeBottomY, 10, centerX, treeBottomY, 180);
      baseGrad.addColorStop(0, `rgba(${theme.accent}, ${0.12 * globalProgress})`);
      baseGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = baseGrad;
      ctx.beginPath();
      ctx.ellipse(centerX, treeBottomY, 160, 45, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 重置動畫觸發
    function triggerReplay() {
      animStartTime = performance.now();
      generateTreeStars();
    }

    // 互動控制與監聽事件
    function setupInteractions() {
      // 重新浮現按鈕
      document.getElementById('btnReplay').addEventListener('click', () => {
        triggerReplay();
      });

      // 主題切換
      const btnColor = document.getElementById('btnColorTheme');
      const themeDot = document.getElementById('themeDot');
      const themeName = document.getElementById('themeName');

      btnColor.addEventListener('click', () => {
        currentThemeIdx = (currentThemeIdx + 1) % COLOR_THEMES.length;
        const current = COLOR_THEMES[currentThemeIdx];
        themeName.textContent = current.name;
        themeDot.style.backgroundColor = current.color;
        themeDot.style.boxShadow = `0 0 8px ${current.color}`;
      });

      // 自動旋轉開關
      const btnRotate = document.getElementById('btnRotateToggle');
      const rotateIcon = document.getElementById('rotateIcon');
      btnRotate.addEventListener('click', () => {
        autoRotate = !autoRotate;
        if (autoRotate) {
          rotateIcon.classList.add('animate-spin');
          rotateIcon.classList.remove('opacity-40');
        } else {
          rotateIcon.classList.remove('animate-spin');
          rotateIcon.classList.add('opacity-40');
        }
      });

      // 滑鼠 / 觸控拖曳 3D 旋轉
      const startDrag = (x, y) => {
        isDragging = true;
        lastMouseX = x;
        lastMouseY = y;
      };

      const moveDrag = (x, y) => {
        if (!isDragging) return;
        const dx = x - lastMouseX;
        const dy = y - lastMouseY;

        targetAngleY += dx * 0.008;
        targetAngleX += dy * 0.005;

        // 限制 X 軸上下仰俯視角範圍
        targetAngleX = Math.max(-0.4, Math.min(0.6, targetAngleX));

        lastMouseX = x;
        lastMouseY = y;
      };

      const endDrag = () => {
        isDragging = false;
      };

      // 監聽滑鼠
      canvas.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
      window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
      window.addEventListener('mouseup', endDrag);

      // 監聽觸控 (手機/平板)
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchend', endDrag);
    }

    // 初始化啟動
    window.onload = function () {
      resizeCanvas();
      initSnow();
      generateTreeStars();
      setupInteractions();
      animate();
    };
  </script>
</body>
</html>
